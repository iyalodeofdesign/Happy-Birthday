services:
  app:
    build: .
    image: happy-birthday:latest
    container_name: happy-birthday
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://birthday:birthday@db:5432/birthday
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: birthday
      POSTGRES_PASSWORD: birthday
      POSTGRES_DB: birthday
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birthday -d birthday"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

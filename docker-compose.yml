services:
  app:
    build: .
    image: happy-birthday:latest
    container_name: happy-birthday
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/wishes.db
    volumes:
      - wishes-data:/app/data

volumes:
  wishes-data:
